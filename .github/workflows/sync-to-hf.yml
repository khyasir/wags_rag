name: Sync to Hugging Face Space

# Pushes this repo to the HF Space every time `dev` is updated.
# Requires a repo secret HF_TOKEN (a Hugging Face write token).
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: Yasirkrauf
          HF_SPACE: Wags_POS_Rag
        run: |
          git push --force \
            "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_USER}/${HF_SPACE}" \
            HEAD:main
